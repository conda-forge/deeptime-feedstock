{% set name = "deeptime" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}-ml/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 9ec37d0a43024ccc4bf474ea22034a21f14451a0a143e7405ba7d0acc0aa5b23

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - pybind11 >=3.1.0                       # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake >=3.18
    - ninja

  host:
    - python
    - pip
    - scikit-build-core >=0.10
    - setuptools-scm >=8
    - numpy
    - pybind11 >=3.1.0
    - llvm-openmp  # [osx]
    - libgomp  # [linux]

  run:
    - python
    - scipy
    - scikit-learn
    - threadpoolctl

test:
  imports:
    - deeptime
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/deeptime-ml/deeptime
  license: LGPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: Python library for analysis of time series data including dimensionality reduction, clustering, and Markov model estimation.

  description: |
    Deeptime is a Python library for analysis for time series data. 
    In particular, methods for dimensionality reduction, clustering, 
    and Markov model estimation are implemented.
  doc_url: https://deeptime-ml.github.io/
  dev_url: https://github.com/deeptime-ml/deeptime

extra:
  recipe-maintainers:
    - clonker
    - marscher
    - MaaikeG
    - thempel
